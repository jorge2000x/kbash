name: AppImage

# Gera dois AppImages do kbash a cada push na main, a cada tag v* e sob demanda:
#   - embutido: já traz o script de exemplo (examples/sober-optimizer.sh) e abre direto nele;
#   - limpo: sem script, abre na tela inicial (home) para escolher um arquivo.
# Cada um sai em x86_64 (runner ubuntu-24.04) e aarch64 (runner ubuntu-24.04-arm).
# Os arquivos saem como artefatos do run; em tags v* também vão para a Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: AppImage ${{ matrix.variant }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Container ubuntu:24.04 + Python 3.11 (deadsnakes): é a receita do build de 39 MB
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: embutido
            arch: x86_64
            runner: ubuntu-24.04
            payload: examples/sober-optimizer.sh
            out: kbash-embutido-x86_64.AppImage
          - variant: limpo
            arch: x86_64
            runner: ubuntu-24.04
            payload: ""
            out: kbash-limpo-x86_64.AppImage
          - variant: embutido
            arch: aarch64
            runner: ubuntu-24.04-arm
            payload: examples/sober-optimizer.sh
            out: kbash-embutido-aarch64.AppImage
          - variant: limpo
            arch: aarch64
            runner: ubuntu-24.04-arm
            payload: ""
            out: kbash-limpo-aarch64.AppImage

    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg \
            software-properties-common binutils file squashfs-tools xz-utils python3

      - name: Python 3.11 (PPA deadsnakes)
        run: |
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y --no-install-recommends python3.11 python3.11-venv
          python3.11 --version

      - name: Venv com PySide6 6.10.2 (Qt igual ao dos pacotes Ubuntu)
        run: |
          python3.11 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install "PySide6-Essentials==6.10.2" "shiboken6==6.10.2"

      - name: Pacotes Kirigami/Breeze (Ubuntu 26.04)
        run: |
          mkdir -p "$RUNNER_TEMP/debs" && cd "$RUNNER_TEMP/debs"
          # aarch64: os mesmos pacotes do pool, em ports.ubuntu.com e com sufixo _arm64
          sed -e 's#archive.ubuntu.com/ubuntu/#ports.ubuntu.com/ubuntu-ports/#' \
              -e 's/_amd64\.deb/_arm64.deb/' \
              "$GITHUB_WORKSPACE/tools/breeze-debs.txt" > "$RUNNER_TEMP/breeze-debs.txt"
          if [ "${{ matrix.arch }}" = x86_64 ]; then
              cp "$GITHUB_WORKSPACE/tools/breeze-debs.txt" "$RUNNER_TEMP/breeze-debs.txt"
          fi
          grep "^https" "$RUNNER_TEMP/breeze-debs.txt" | xargs -n1 -P8 curl -sSfO
          mkdir -p "$RUNNER_TEMP/debsx"
          for f in *.deb; do dpkg-deb -x "$f" "$RUNNER_TEMP/debsx"; done

      - name: appimagetool (extraído, sem FUSE)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Build
        env:
          VENV: ${{ runner.temp }}/venv
          DEBS: ${{ runner.temp }}/debsx
          ARCH_KBASH: ${{ matrix.arch }}
          BUILD: ${{ runner.temp }}/appdir-${{ matrix.variant }}
          APPIMAGETOOL: ${{ runner.temp }}/squashfs-root/AppRun
          PAYLOAD: ${{ matrix.payload }}
          ICU_DATA_SO: ${{ github.workspace }}/tools/prebuilt/libicudata.so.73
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          bash tools/build-appimage.sh "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/out/${{ matrix.out }}"

      - name: Teste de fumaça (check do exemplo dentro do AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x "$RUNNER_TEMP/out/${{ matrix.out }}"
          # só leitura: valida o runtime embutido; não executa nenhum script
          "$RUNNER_TEMP/out/${{ matrix.out }}" check examples/all-options.sh

      - name: Checksum
        run: |
          cd "$RUNNER_TEMP/out"
          sha256sum "${{ matrix.out }}" > "${{ matrix.out }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --generate-notes dist/* 2>/dev/null \
          || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
