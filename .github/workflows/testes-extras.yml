name: Testes extras

# Fuzzing do parser, métricas radon (ratchet) e pytest-qt (smoke de GUI), via
# tools/testes-extras.sh. Roda em mudanças relevantes: código, testes, ferramentas
# ou dependências. Complementa o portão (verificacao.yml), não o substitui.
#
# A GUI só roda de verdade se o Kirigami estiver instalado; no runner padrão ele não
# está, então os testes de GUI aparecem como "skipped" com o motivo no log.

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/testes-extras.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extras:
    name: Fuzzing, radon e pytest-qt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-qt pytest-timeout radon PySide6-Essentials==6.10.2

      - name: Testes extras
        env:
          QT_QPA_PLATFORM: offscreen
          FUZZ_ITERACOES: "5000"
          FUZZ_SEMENTES: "1 2 3"
        run: bash tools/testes-extras.sh

      - name: Relatório do fuzzing (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: .fuzz-crashes/
          if-no-files-found: ignore
