name: Verificação

# Pipeline único do kbash. Roda em todo push e PR.
#
#   portao   (obrigatório)  ruff (repo inteiro), pyright, pytest (core + smoke de GUI),
#                           crosshair, fuzzing do parser, métricas radon (ratchet) e
#                           pytest-qt. Sem Kirigami no runner, os testes de GUI ficam
#                           pulados com o motivo no log.
#   gui      (opcional)     suíte completa de GUI (test_gui, test_ui, qtbot) contra o
#                           Kirigami do Ubuntu 26.04, via tools/gui-completo.sh (sob
#                           dbus-run-session). Não bloqueia por enquanto: passa em
#                           test_gui (66), test_ui (38) e qtbot (3), um processo por arquivo.
#   mutmut   (opcional)     mutação dos módulos críticos (§16.4). Só roda manualmente com
#                           a entrada "mutmut" marcada. Não bloqueia.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gui:
        description: "Rodar a suíte completa de GUI (opcional, não bloqueia)"
        type: boolean
        default: false
      mutmut:
        description: "Rodar mutmut nos módulos críticos (opcional, lento, não bloqueia)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  portao:
    name: Portão (obrigatório)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # verificar.sh compara com origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # mesma versão do AppImage (§11.1)

      - name: Bibliotecas do Qt (PySide6 carrega libEGL, xkb, xcb e dbus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-qt pytest-timeout radon
          # pytest-qt exige um binding Qt instalado; mesma versão do AppImage
          python -m pip install "PySide6-Essentials==6.10.2" "shiboken6==6.10.2"

      - name: Ruff, pyright, pytest (core), crosshair
        env:
          PYTHON: python
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          PULAR_MUTMUT: "1"  # mutmut fica na job opcional
        run: tools/verificar.sh

      - name: Fuzzing do parser, métricas radon e pytest-qt
        env:
          PYTHON: python
          QT_QPA_PLATFORM: offscreen
          FUZZ_ITERACOES: "5000"
          FUZZ_SEMENTES: "1 2 3"
        run: tools/testes-extras.sh

      - name: Casos de fuzzing (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: .fuzz-crashes/
          if-no-files-found: ignore

  gui:
    name: GUI completa (opcional)
    if: github.event_name == 'workflow_dispatch' && inputs.gui
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambiente do AppImage (Python 3.11, PySide6 6.10.2, Kirigami do 26.04)
        run: |
          python -m venv "$RUNNER_TEMP/venv311"
          "$RUNNER_TEMP/venv311/bin/pip" install -q --upgrade pip
          "$RUNNER_TEMP/venv311/bin/pip" install -q "PySide6-Essentials==6.10.2" "shiboken6==6.10.2" \
            pytest pytest-qt pytest-timeout hypothesis icontract
          "$RUNNER_TEMP/venv311/bin/pip" install -q -e .
          mkdir -p "$RUNNER_TEMP/debs" "$RUNNER_TEMP/debsx" "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/debs"
          grep '^https' "$GITHUB_WORKSPACE/tools/breeze-debs.txt" | xargs -n1 -P4 curl -sSfO
          for f in *.deb; do dpkg-deb -x "$f" "$RUNNER_TEMP/debsx"; done
          cd "$RUNNER_TEMP/tools"
          curl -sSfLo appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null

      - name: Bibliotecas do Qt (o PySide6 carrega libEGL, xkb, xcb e dbus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1 dbus

      - name: Suíte de GUI (um processo por arquivo)
        env:
          PYTHON: ${{ runner.temp }}/venv311/bin/python
          VENV: ${{ runner.temp }}/venv311
          DEBS: ${{ runner.temp }}/debsx
          BUILD: ${{ runner.temp }}/appdir
          APPIMAGETOOL: ${{ runner.temp }}/tools/squashfs-root/AppRun
          SAIDA: ${{ runner.temp }}/dist-gui
          QT_QPA_PLATFORM: offscreen
        run: tools/gui-completo.sh

  mutmut:
    name: Mutmut (opcional)
    if: github.event_name == 'workflow_dispatch' && inputs.mutmut
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cache do mutmut
        uses: actions/cache@v4
        with:
          path: .mutmut-cache
          key: mutmut-${{ github.ref_name }}-${{ hashFiles('src/kbash/core/**', 'tests/**', 'pyproject.toml') }}
          restore-keys: |
            mutmut-${{ github.ref_name }}-
            mutmut-

      - name: Mutmut nos módulos críticos (relatório)
        run: |
          python -m mutmut run || true
          python -m mutmut results | tee mutmut-resultados.txt || true
          python -m mutmut export-cicd-stats || true
          echo "sobreviventes: $(grep -cE 'survived|no tests' mutmut-resultados.txt || true)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-resultados
          path: mutmut-resultados.txt
          if-no-files-found: ignore
