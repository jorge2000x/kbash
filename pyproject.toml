[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kbash"
version = "0.1.0"
description = "Runtime de scripts com GUI Kirigami"
readme = "SPEC.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = []
dev = ["pytest>=7"]

[project.scripts]
kbash = "kbash.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kbash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:kbash.*"]
