[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kbash"
version = "0.1.0"
description = "Runtime de scripts com GUI Kirigami"
readme = "SPEC.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = []
# verificação do core (SPEC §16): só ferramentas de dev, nenhuma em runtime
dev = [
    "pytest>=7",
    "ruff",
    "pyright",
    "hypothesis",
    "icontract",
    "crosshair-tool",
    "mutmut",
]
[project.scripts]
kbash = "kbash.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kbash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:kbash.*"]

[tool.ruff]
line-length = 110  # estilo já usado no código; SPEC §16.3

[tool.ruff.lint]
select = ["E", "F", "B", "S", "UP", "SIM", "RUF"]

# em testes, assert é o mecanismo do pytest, não um risco de segurança.
# Fixtures usam caminhos fixos em /tmp, tokens de exemplo e processos reais (integração);
# nada disso recebe entrada não confiável. Demais regras S continuam valendo em src/.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S105", "S603", "S607"]

[tool.pyright]
# SPEC §16.3: basic agora; sobe para strict pasta por pasta.
# Escopo: o core (Python puro). gui/ depende de PySide e fica fora do portão.
typeCheckingMode = "basic"
include = ["src/kbash/core"]

# SPEC §16.3/§16.4: mutação só nos módulos críticos.
[tool.mutmut]
# o mutmut copia só os módulos mutados; o resto do pacote e os testes vão junto
also_copy = ["src/kbash", "tests", "examples", "pyproject.toml"]
source_paths = [
    "src/kbash/core/parser.py",
    "src/kbash/core/planner.py",
    "src/kbash/core/ipc.py",
    "src/kbash/core/actions.py",
]
# só os testes do core: GUI (Qt) fica fora da mutação (SPEC §16.1)
pytest_add_cli_args_test_selection = [
    "tests/test_planner.py",
    "tests/test_props_planner.py",
    "tests/test_needs_step.py",
    "tests/test_parser.py",
    "tests/test_props_parser.py",
    "tests/test_ipc.py",
    "tests/test_props_ipc.py",
    "tests/test_core_robustness.py",
    "tests/test_actions_run.py",
    "tests/test_props_actions.py",
    "tests/test_actions_and_groups.py",
    "tests/test_display_options.py",
]
